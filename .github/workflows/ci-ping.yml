name: CI Ping

on:
  push:
    branches:
      - dev
  schedule:
    - cron: '*/5 * * * *'
  create:
  check_suite:
    types:
      - completed
  check_run:
    types:
      - created
      - rerequested
  workflow_dispatch:

jobs:
  ping:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'create' &&
        github.ref_type == 'branch' &&
        startsWith(github.ref_name, 'gha-build-')
      ) ||
      (
        github.event_name == 'check_suite' &&
        github.event.check_suite.head_branch == 'dev' &&
        github.event.check_suite.app.slug == 'supabase'
      ) ||
      (
        github.event_name == 'check_run' &&
        github.event.check_run.check_suite.head_branch == 'dev' &&
        github.event.check_run.app.slug == 'supabase'
      )
    runs-on: ubuntu-22.04
    steps:
      - name: Echo
        run: |
          echo "CI ping on $(date -u)"
          echo "sha=${GITHUB_SHA}"
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref_type=${GITHUB_REF_TYPE}"
          echo "ref_name=${GITHUB_REF_NAME}"
          echo "suite_app=${{ github.event_name == 'check_suite' && github.event.check_suite.app.slug || '' }}"
          echo "suite_sha=${{ github.event_name == 'check_suite' && github.event.check_suite.head_sha || '' }}"
          echo "run_app=${{ github.event_name == 'check_run' && github.event.check_run.app.slug || '' }}"
          echo "run_sha=${{ github.event_name == 'check_run' && github.event.check_run.head_sha || '' }}"
